<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simon</title><link rel="stylesheet" href="shared.css">
<style>
.board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(86vw,400px);aspect-ratio:1;padding:14px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.p{border:0;border-radius:26px;background:var(--c);filter:brightness(.62) saturate(.9);cursor:pointer;transition:filter .08s,transform .08s,box-shadow .08s}
.p.on{filter:brightness(1.2) saturate(1.1);transform:scale(.97);box-shadow:0 0 36px var(--c)}
.mid{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--solid);box-shadow:0 4px 16px rgba(0,0,0,.25);display:grid;place-items:center;border:0;font-size:18px;font-weight:700;color:var(--text);cursor:pointer;text-align:center;line-height:1.1}
.mid small{display:block;font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.msg{font-weight:600;font-size:17px;min-height:24px}
</style></head><body>
<header class="bar"><a class="back" href="index.html">Games</a><h1>Simon</h1><div class="right"><button class="btn sec" id="newbtn">New Game</button></div></header>
<main>
<div class="stats"><div class="stat"><small>Round</small><b id="rd">0</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div>
<div class="msg" id="msg">Watch the pattern, then repeat it</div>
<div class="board" id="board">
<button class="p" data-i="0" style="--c:#30d158"></button><button class="p" data-i="1" style="--c:#ff453a"></button>
<button class="p" data-i="2" style="--c:#ffd60a"></button><button class="p" data-i="3" style="--c:#0a84ff"></button>
<button class="mid" id="mid">Start</button></div>
<div class="hint">Click the pads, or press Q W A S or 1 to 4. Space starts.</div>
</main>
<script>
const $=id=>document.getElementById(id),pads=[...document.querySelectorAll('.p')];
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
let seq=[],pos=0,state='idle',round=0,best=+ls('bestSimon')||0,ac,gid=0;const F=[392,330,262,196];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f,d,type='sine'){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);const t=ac.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.02);g.gain.linearRampToValueAtTime(0,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}}
function light(i,ms){pads[i].classList.add('on');tone(F[i],ms/1000);setTimeout(()=>pads[i].classList.remove('on'),ms)}
function ui(){$('rd').textContent=round;$('best').textContent=best}
async function play(){const id=gid;state='show';$('msg').textContent='Watch';await sleep(600);const t=Math.max(200,540-round*20);for(const i of seq){if(id!==gid)return;light(i,t);await sleep(t*1.4)}if(id!==gid)return;state='input';pos=0;$('msg').textContent='Your turn'}
function start(){gid++;audio();seq=[Math.random()*4|0];round=0;ui();$('mid').innerHTML='<span>Round<small id="mr">1</small></span>';$('mid').disabled=true;play()}
function press(i){if(state!=='input')return;light(i,220);
  if(i!==seq[pos]){state='idle';tone(110,.5,'sawtooth');$('msg').textContent='Game over. Score '+round;$('mid').disabled=false;$('mid').textContent='Again';return}
  if(++pos===seq.length){round++;if(round>best){best=round;ls('bestSimon',best)}ui();$('mr')&&($('mr').textContent=round+1);state='show';seq.push(Math.random()*4|0);const id=gid;setTimeout(()=>{if(id===gid)play()},500)}}
pads.forEach((p,i)=>{p.setAttribute('aria-label',['Green','Red','Yellow','Blue'][i]);p.addEventListener('pointerdown',e=>{e.preventDefault();audio();press(+p.dataset.i)});p.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();press(+p.dataset.i)}})});
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;const i={q:0,w:1,a:2,s:3,1:0,2:1,3:2,4:3}[e.key.toLowerCase()];if(i!==undefined)press(i);else if((e.key===' '||e.key==='Enter')&&state==='idle'){e.preventDefault();start()}});
$('mid').onclick=start;$('newbtn').onclick=start;ui();
</script></body></html>
