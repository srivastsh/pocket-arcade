<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Type</title><link rel="stylesheet" href="shared.css"><style>
.wrap{position:relative;width:min(94vw,680px);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);padding:20px}
.txt{height:128px;overflow:hidden;font-size:24px;line-height:42px;font-weight:500;position:relative}
.txt span{display:inline-block;margin-right:.45em;border-radius:6px;padding:0 2px}
.txt .cur{background:rgba(10,132,255,.2)}.txt .ok{color:var(--green)}.txt .bad{color:var(--red);text-decoration:line-through}
#in{width:min(94vw,680px);padding:14px 18px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);font:inherit;font-size:20px;color:var(--text);outline:2px solid transparent}#in:focus{outline-color:var(--blue)}</style></head><body><header class="bar"><a class="back" href="index.html">Games</a><h1>Type</h1><div class="right"><button class="btn sec" id="newbtn">Restart</button></div></header><main>
<div class="stats"><div class="stat"><small>Time</small><b id="time">30</b></div><div class="stat"><small>WPM</small><b id="wpm">0</b></div><div class="stat"><small>Accuracy</small><b id="acc">100%</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div>
<div class="wrap" id="wrap"><div class="txt" id="txt"></div><div class="overlay hide" id="ov"><div class="game-sheet" role="group" aria-labelledby="sheet-title"><h2 id="sheet-title">Time</h2><p></p><button class="btn">Play Again</button></div></div></div>
<input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Start typing" aria-label="Type here"></main><script src="common.js"></script><script>
const W="the of and to in is you that it he was for on are as with his they at be this from have or by one had not but what all were when we there can an your which their said if do will each about how up out them then she many some so these would other into has more her two like him see time could no make than first been its who now people my made over did down only way find use may water long little very after words called just where most know get through back much before go good new write our used me man too any day same right look think also around another came come work three word must because does part even place well such here take why help put different away again off went old number great tell men say small every found still between name should home big give air line set own under read last never us left end along while might next sound below saw something thought both few those always looked show large often together asked house don't world going want school important until form food keep children feet land side without boy once animals life enough took sometimes four head above kind began almost live page got earth need far hand high year mother light country father let night picture being study second soon story since white ever paper hard near sentence better best across during today however sure knew try told young sun thing whole hear example heard several change answer room sea against top turned learn point city play toward five using himself usually".split(' ');
let words,idx,cor,tot,chars,t0,tm,run,best=+ls('bestType')||0;const txt=$('txt'),inp=$('in'),ov=$('ov');
function reset(){clearInterval(tm);words=shuffle(W.slice()).slice(0,200);idx=cor=tot=chars=0;run=false;t0=0;txt.innerHTML=words.map(w=>`<span>${w}</span>`).join(' ');txt.scrollTop=0;ov.classList.add('hide');inp.value='';inp.disabled=false;inp.focus();$('time').textContent=30;$('wpm').textContent=0;$('acc').textContent='100%';$('best').textContent=best;mark()}
function mark(){const s=txt.children;if(s[idx]){s[idx].classList.add('cur');txt.scrollTop=Math.max(0,s[idx].offsetTop-42)}}
function end(){run=false;clearInterval(tm);inp.disabled=true;const wpm=Math.round(chars/5*2);if(wpm>best){best=wpm;ls('bestType',best)}$('best').textContent=best;overlay(ov,wpm+' WPM',`${cor} of ${tot} words correct`,'Play Again',reset)}
inp.addEventListener('input',()=>{if(!run&&inp.value.trim()){run=true;t0=Date.now();tm=setInterval(()=>{const l=30-((Date.now()-t0)/1000|0);$('time').textContent=Math.max(l,0);$('wpm').textContent=Math.round(chars/5/Math.max((Date.now()-t0)/60000,.05));if(l<=0)end()},250)}
  const v=inp.value;if(v.endsWith(' ')){const w=v.trim(),s=txt.children[idx];if(!w){inp.value='';return}tot++;const ok=w===words[idx];s.classList.remove('cur');s.classList.add(ok?'ok':'bad');if(ok){cor++;chars+=w.length+1}idx++;inp.value='';$('acc').textContent=Math.round(cor/tot*100)+'%';mark()}});
document.body.addEventListener('click',e=>{if(!e.target.closest('a,button'))inp.focus()});$('newbtn').onclick=reset;reset();</script></body></html>
