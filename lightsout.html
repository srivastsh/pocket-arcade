<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lights Out</title><link rel="stylesheet" href="shared.css">
<style>
.board{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(88vw,400px);padding:14px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.l{aspect-ratio:1;border:0;border-radius:18%;background:var(--cell);cursor:pointer;transition:background .18s,box-shadow .18s,transform .1s}
.l:active{transform:scale(.93)}
.l.on{background:linear-gradient(160deg,#ffe770,#ffc400);box-shadow:0 0 22px rgba(255,200,0,.55),inset 0 1px 0 rgba(255,255,255,.6)}
</style></head><body>
<header class="bar"><a class="back" href="index.html">Games</a><h1>Lights Out</h1><div class="right"><button class="btn sec" id="rs">Restart</button><button class="btn sec" id="newbtn">New Puzzle</button></div></header>
<main>
<div class="stats"><div class="stat"><small>Level</small><b id="lv">1</b></div><div class="stat"><small>Moves</small><b id="mv">0</b></div><div class="stat"><small>Par</small><b id="par">0</b></div></div>
<div class="board" id="board"><div class="overlay hide" id="ov"><div class="game-sheet" role="group" aria-labelledby="sheet-title"><h2 id="sheet-title">Lights out</h2><p id="ovp"></p><button class="btn" id="ovb">Next Level</button></div></div></div>
<div class="hint">Each press flips a light and its neighbors. Turn them all off. WASD or arrows select a light. Return flips it.</div>
</main>
<script src="controls.js"></script><script>
const $=id=>document.getElementById(id),brd=$('board'),ov=$('ov');let lv=1,g,g0,moves,par;
for(let i=0;i<25;i++){const b=document.createElement('button');b.className='l';b.dataset.i=i;b.setAttribute('aria-label','Light '+(i+1));brd.insertBefore(b,ov)}
function tog(a,i){const r=i/5|0,c=i%5;for(const j of[i,c>0&&i-1,c<4&&i+1,r>0&&i-5,r<4&&i+5])if(j!==false)a[j]^=1}
function level(){par=Math.min(2+lv,14);let a;do{a=Array(25).fill(0);const idx=[...Array(25).keys()];for(let i=24;i>0;i--){const j=Math.random()*(i+1)|0;[idx[i],idx[j]]=[idx[j],idx[i]]}idx.length=par;idx.forEach(i=>tog(a,i))}while(!a.some(Boolean));g0=a.slice();restart()}
let resultTimer;
function restart(){clearTimeout(resultTimer);g=g0.slice();moves=0;ov.classList.add('hide');render()}
function render(){[...brd.querySelectorAll('.l')].forEach((b,i)=>b.classList.toggle('on',!!g[i]));$('lv').textContent=lv;$('mv').textContent=moves;$('par').textContent=par}
brd.addEventListener('click',e=>{const b=e.target.closest('.l');if(!b||!ov.classList.contains('hide')||!g.some(Boolean))return;tog(g,+b.dataset.i);moves++;render();
  if(!g.some(Boolean))resultTimer=setTimeout(()=>{$('ovp').textContent=`${moves} moves. Par ${par}.`;ov.classList.remove('hide')},350)});
$('ovb').onclick=()=>{lv++;level()};$('rs').onclick=restart;$('newbtn').onclick=level;level();

enableGridNavigation(brd, '.l');
</script></body></html>
