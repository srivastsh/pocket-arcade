<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math</title><link rel="stylesheet" href="shared.css"><style>
.wrap{position:relative;width:min(92vw,440px);padding:36px 24px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:22px;transition:box-shadow .15s}
.wrap.ok{box-shadow:var(--shadow),inset 0 0 0 100vmax rgba(52,199,89,.25)}.wrap.no{box-shadow:var(--shadow),inset 0 0 0 100vmax rgba(255,59,48,.25)}
.q{font-size:clamp(40px,12vw,64px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#a{width:70%;padding:14px;border:0;border-radius:14px;background:var(--cell);font:inherit;font-size:30px;font-weight:600;text-align:center;color:var(--text);outline:2px solid transparent}#a:focus{outline-color:var(--blue)}</style></head><body><header class="bar"><a class="back" href="index.html">Games</a><h1>Math</h1><div class="right"><button class="btn sec" id="newbtn">Start</button></div></header><main>
<div class="stats"><div class="stat"><small>Time</small><b id="time">60</b></div><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Streak</small><b id="st">0</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div>
<div class="wrap" id="wrap"><div class="q" id="q">Ready</div><input id="a" inputmode="numeric" autocomplete="off" placeholder="Answer" aria-label="Answer"><div class="overlay" id="ov"><div class="game-sheet" role="group" aria-labelledby="sheet-title"><h2 id="sheet-title">Math</h2><p>Solve as many as you can in 60 seconds</p><button class="btn">Play</button></div></div></div></main><script src="common.js"></script><script>
let sc,st,ans,t,run,tm,best=+ls('bestMath')||0;const w=$('wrap'),ov=$('ov'),a=$('a');
function gen(){const L=Math.min(1+(sc/6|0),6),k=rnd(L>1?3:2);let x,y;
  if(k===0){x=2+rnd(8*L);y=2+rnd(8*L);ans=x+y;$('q').textContent=`${x} + ${y}`}
  else if(k===1){x=5+rnd(10*L);y=1+rnd(x);ans=x-y;$('q').textContent=`${x} − ${y}`}
  else{x=2+rnd(3+L*2);y=2+rnd(3+L*2);ans=x*y;$('q').textContent=`${x} × ${y}`}a.value=''}
function start(){sc=st=0;t=60;run=true;ov.classList.add('hide');$('score').textContent=0;$('st').textContent=0;$('time').textContent=60;$('best').textContent=best;gen();a.disabled=false;a.focus();clearInterval(tm);tm=setInterval(()=>{$('time').textContent=--t;if(t<=0)end()},1000)}
function end(){run=false;clearInterval(tm);a.disabled=true;if(sc>best){best=sc;ls('bestMath',best)}$('best').textContent=best;overlay(ov,'Time','Score '+sc,'Play Again',start)}
function flash(c){w.classList.remove('ok','no');void w.offsetWidth;w.classList.add(c);clearTimeout(w._t);w._t=setTimeout(()=>w.classList.remove(c),180)}
a.addEventListener('input',()=>{if(!run)return;const v=a.value.trim();if(v===''||v==='-')return;if(+v===ans){sc++;st++;flash('ok');$('score').textContent=sc;$('st').textContent=st;gen()}else if(v.length>=String(ans).length){st=0;$('st').textContent=0;flash('no');a.value=''}});
document.body.addEventListener('click',e=>{if(run&&!e.target.closest('a,button'))a.focus()});ov.querySelector('button').onclick=start;$('newbtn').onclick=start;a.disabled=true;</script></body></html>
