<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whack</title><link rel="stylesheet" href="shared.css"><style>
.field{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(90vw,420px);padding:18px;border-radius:var(--r);background:linear-gradient(160deg,#6bc46d,#3f9b4c);box-shadow:var(--shadow)}
.h{position:relative;aspect-ratio:1;border:0;padding:0;background:radial-gradient(ellipse at 50% 72%,#3b2a1e 0 46%,transparent 47%);overflow:hidden;cursor:pointer;border-radius:16px}
.m{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-size:clamp(44px,13vw,72px);line-height:1;transform:translateY(120%);transition:transform .11s ease-out;pointer-events:none}
.h.up .m{transform:translateY(0)}
.h.hit .m{transform:translateY(120%) scale(.6)}
.field .overlay{background:rgba(20,80,40,.55);color:#fff}.field .overlay p{color:#e8ffe8}</style></head><body><header class="bar"><a class="back" href="index.html">Games</a><h1>Whack</h1><div class="right"><button class="btn sec" id="newbtn">Start</button></div></header><main>
<div class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Time</small><b id="time">30</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div>
<div class="field" id="field"><div class="overlay" id="ov"><div class="game-sheet" role="group" aria-labelledby="sheet-title"><h2 id="sheet-title">Whack</h2><p>Hit the moles. Avoid the bombs.</p><button class="btn">Play</button></div></div></div></main><script src="common.js"></script><script>
const f=$('field'),ov=$('ov');let hs=[],score,t,run,best=+ls('bestWhack')||0,tm,gid=0,st;
for(let i=0;i<9;i++){const b=document.createElement('button');b.className='h';b.setAttribute('aria-label','Hole '+(i+1));b.innerHTML='<div class="m"></div>';f.insertBefore(b,ov);hs.push(b)}
function show(){if(!run)return;const id=gid;const free=hs.filter(h=>!h.classList.contains('up'));if(free.length){const h=free[rnd(free.length)],bomb=Math.random()<.17;h.dataset.k=bomb?'b':'m';h.firstChild.textContent=bomb?'💣':'🐹';const tok=h._tok=(h._tok||0)+1;h.classList.remove('hit');h.classList.add('up');setTimeout(()=>{if(h._tok===tok)h.classList.remove('up')},Math.max(480,950-(30-t)*14))}
  clearTimeout(st);st=setTimeout(()=>{if(id===gid)show()},Math.max(260,720-(30-t)*13))}
function start(){gid++;clearTimeout(st);score=0;t=30;run=true;$('score').textContent=0;$('time').textContent=30;$('best').textContent=best;ov.classList.add('hide');hs.forEach(h=>h.classList.remove('up'));show();clearInterval(tm);tm=setInterval(()=>{$('time').textContent=--t;if(t<=0)end()},1000)}
function end(){run=false;gid++;clearTimeout(st);clearInterval(tm);hs.forEach(h=>h.classList.remove('up'));if(score>best){best=score;ls('bestWhack',best);$('best').textContent=best}overlay(ov,'Time','Score '+score,'Play Again',start)}
f.addEventListener('pointerdown',e=>{const h=e.target.closest('.h');if(!h||!run||!h.classList.contains('up'))return;score+=h.dataset.k==='b'?-15:10;$('score').textContent=score;h.classList.remove('up');h.classList.add('hit')});
$('newbtn').onclick=start;ov.querySelector('button').onclick=start;</script></body></html>
