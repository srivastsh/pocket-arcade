<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Four</title><link rel="stylesheet" href="shared.css">
<style>
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px;width:min(92vw,520px);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);position:relative}
.col{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:none;border-radius:999px;cursor:pointer;transition:background .15s}
.col:hover:not(:disabled){background:rgba(128,128,128,.14)}
.hole{aspect-ratio:1;border-radius:50%;background:var(--cell);box-shadow:inset 0 2px 4px rgba(0,0,0,.18);position:relative}
.disc{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 -4px 6px rgba(0,0,0,.18),inset 0 3px 3px rgba(255,255,255,.35)}
.disc.p1{background:linear-gradient(160deg,#ff6b61,#ff453a)}.disc.p2{background:linear-gradient(160deg,#ffe14d,#ffc800)}
.disc.drop{animation:drop .42s cubic-bezier(.5,0,.9,.5) both}
@keyframes drop{from{transform:translateY(calc(var(--d)*-1*(100% + 8px)))}60%{transform:translateY(0)}78%{transform:translateY(-8%)}to{transform:translateY(0)}}
.disc.win{animation:pulse .8s ease-in-out infinite;outline:4px solid rgba(255,255,255,.9)}
@keyframes pulse{50%{transform:scale(.88)}}
.turn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;min-height:24px}
.dot{width:14px;height:14px;border-radius:50%}
</style></head><body>
<header class="bar"><a class="back" href="index.html">Games</a><h1>Connect Four</h1><div class="right"><button class="btn sec" id="newbtn">New Game</button></div></header>
<main>
<div class="seg" id="seg"><button class="on" data-m="2">Easy</button><button data-m="6">Hard</button><button data-m="0">2 Players</button></div>
<div class="stats"><div class="stat"><small id="n1">You</small><b id="w1">0</b></div><div class="stat"><small id="n2">CPU</small><b id="w2">0</b></div></div>
<div class="turn"><span class="dot" id="dot"></span><span id="msg"></span></div>
<div class="board" id="board"></div>
<div class="hint">A/D or ←/→ chooses a column. Return drops a disc.</div></main>
<script src="controls.js"></script><script>
const $=id=>document.getElementById(id),R=6,C=7;
let g,turn,depth=2,over,busy,wins=[0,0],last=null,line=null,aiT;
const brd=$('board');
for(let c=0;c<C;c++){const col=document.createElement('button');col.className='col';col.dataset.c=c;col.setAttribute('aria-label','Column '+(c+1));for(let r=0;r<R;r++){const h=document.createElement('div');h.className='hole';col.append(h)}brd.append(col)}
function winAt(b,r,c,p){for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[[r,c]];for(const s of[1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<R&&cc>=0&&cc<C&&b[rr][cc]===p){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s}}if(cells.length>=4)return cells}return null}
const WIN=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const er=r+3*dr,ec=c+3*dc;if(er>=0&&er<R&&ec>=0&&ec<C)WIN.push([0,1,2,3].map(i=>[r+dr*i,c+dc*i]))}
function ev(b,p){let s=0;for(let r=0;r<R;r++)if(b[r][3]===p)s+=3;else if(b[r][3])s-=3;
  for(const w of WIN){let a=0,k=0;for(const[r,c]of w){const v=b[r][c];if(v===p)a++;else if(v)k++}if(a&&k)continue;if(a===3)s+=50;else if(a===2)s+=10;else if(k===3)s-=60;else if(k===2)s-=8}return s}
const order=[3,2,4,1,5,0,6];
function nm(b,d,a,bt,p){const ms=order.filter(c=>!b[0][c]);if(!ms.length)return 0;if(!d)return ev(b,p);let best=-1e9;
  for(const c of ms){let r=R-1;while(b[r][c])r--;b[r][c]=p;const s=winAt(b,r,c,p)?100000+d:-nm(b,d-1,-bt,-a,3-p);b[r][c]=0;if(s>best)best=s;if(best>a)a=best;if(a>=bt)break}return best}
function ai(){let ms=order.filter(c=>!g[0][c]);if(depth<=2&&Math.random()<.2)return ms[Math.random()*ms.length|0];
  let best=-1e9,bc=ms[0];for(const c of ms){let r=R-1;while(g[r][c])r--;g[r][c]=2;const s=winAt(g,r,c,2)?1e6:-nm(g,depth-1,-1e9,1e9,1);g[r][c]=0;if(s>best){best=s;bc=c}}return bc}
function render(){const cols=brd.children;for(let c=0;c<C;c++){cols[c].disabled=over||busy||(depth&&turn===2)||!!g[0][c];for(let r=0;r<R;r++){const h=cols[c].children[r];h.innerHTML='';const v=g[r][c];if(v){const d=document.createElement('div');d.className='disc p'+v;if(last&&last[0]===r&&last[1]===c){d.classList.add('drop');d.style.setProperty('--d',r+1)}if(line&&line.some(x=>x[0]===r&&x[1]===c))d.classList.add('win');h.append(d)}}}
  const dot=$('dot');dot.style.background=turn===1?'#ff453a':'#ffc800';
  $('msg').textContent=over?(line?(depth?(turn===1?'You win':'CPU wins'):(turn===1?'Red wins':'Yellow wins')):'Draw'):(depth?(turn===1?'Your turn':'CPU is thinking'):(turn===1?"Red's turn":"Yellow's turn"))}
function reset(){clearTimeout(aiT);g=Array.from({length:R},()=>Array(C).fill(0));turn=1;over=false;busy=false;last=null;line=null;$('n1').textContent=depth?'You':'Red';$('n2').textContent=depth?'CPU':'Yellow';render()}
function play(c){if(over||busy||g[0][c])return;let r=R-1;while(g[r][c])r--;g[r][c]=turn;last=[r,c];const w=winAt(g,r,c,turn);
  if(w){over=true;line=w;wins[turn-1]++;$('w'+turn).textContent=wins[turn-1]}else if(!g[0].includes(0))over=true;
  else{turn=3-turn}
  render();
  if(!over&&depth&&turn===2){busy=true;render();aiT=setTimeout(()=>{busy=false;play(ai())},450)}}
brd.addEventListener('click',e=>{const c=e.target.closest('.col');if(c&&!c.disabled)play(+c.dataset.c)});
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;depth=+b.dataset.m;[...$('seg').children].forEach(x=>x.classList.toggle('on',x===b));wins=[0,0];$('w1').textContent=$('w2').textContent=0;reset()};
$('newbtn').onclick=reset;reset();

enableGridNavigation(brd, '.col', () => !over && !busy);
</script></body></html>
