<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stack</title><link rel="stylesheet" href="shared.css">
<style>
.board{position:relative;width:min(92vw,380px,calc((100vh - 230px)*.6));aspect-ratio:3/5;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden;line-height:0;touch-action:none;cursor:pointer}
canvas{width:100%;height:100%;display:block}
.pf{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:20px;font-weight:700;color:var(--text);opacity:0;transition:opacity .3s;pointer-events:none;line-height:1}
.pf.on{opacity:.9}
</style></head><body>
<header class="bar"><a class="back" href="index.html">Games</a><h1>Stack</h1><div class="right"><button class="btn sec" id="newbtn">New Game</button></div></header>
<main>
<div class="stats"><div class="stat"><small>Height</small><b id="score">0</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div>
<div class="board" id="board"><canvas id="cv"></canvas><div class="pf" id="pf">Perfect</div><div class="overlay" id="ov"><div class="game-sheet" role="group" aria-labelledby="ovt"><h2 id="ovt">Stack</h2><p id="ovp">Click, tap or press space to drop the block</p></div></div></div>
</main>
<script src="board-colors.js"></script><script>
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Array.isArray(r)?r[0]:r;r=Math.max(0,Math.min(+r||0,Math.abs(w)/2,Math.abs(h)/2));this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),ov=$('ov');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const W=360,H=600,BH=26,dpr=Math.min(devicePixelRatio||1,3);cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
let tower,mv,dir,spd,cam,camT,falls,state='idle',last=0,best=+ls('bestStack')||0,dieT=0;
function reset(){tower=[{x:80,w:200}];cam=camT=0;falls=[];state='idle';nb();$('score').textContent=0;$('best').textContent=best;$('ovt').textContent='Stack';$('ovp').textContent='Click, tap or press space to drop the block';ov.classList.remove('hide')}
function nb(){const t=tower[tower.length-1];dir=tower.length%2?1:-1;spd=170+Math.min(tower.length*7,220);mv={x:dir>0?-t.w:W,w:t.w}}
function drop(){
  if(state==='dead'){if(performance.now()-dieT>400)reset();return}
  if(state==='idle'){state='run';ov.classList.add('hide');nb();return}
  const t=tower[tower.length-1],dx=mv.x-t.x,ov2=t.w-Math.abs(dx);
  if(ov2<=0){falls.push({x:mv.x,w:mv.w,y:tower.length,vy:0,h:tower.length});state='dead';dieT=performance.now();$('ovt').textContent='Game Over';$('ovp').textContent='Height '+(tower.length-1)+'. Tap to retry';ov.classList.remove('hide');const s=tower.length-1;if(s>best){best=s;ls('bestStack',best);$('best').textContent=best}return}
  if(Math.abs(dx)<5){tower.push({x:t.x,w:t.w});const p=$('pf');p.classList.add('on');clearTimeout(p._t);p._t=setTimeout(()=>p.classList.remove('on'),500)}
  else{const nx=Math.max(mv.x,t.x),cut={x:dx>0?t.x+t.w:mv.x,w:Math.abs(dx),y:tower.length,vy:0,h:tower.length};falls.push(cut);tower.push({x:nx,w:ov2})}
  $('score').textContent=tower.length-1;camT=Math.max(0,(tower.length-7)*BH);nb()}
function frame(ts){const dt=Math.min((ts-(last||ts))/1000,.033);last=ts;
  if(state!=='dead'){mv.x+=dir*spd*dt;if(mv.x+mv.w>W+60)dir=-1;if(mv.x<-60)dir=1}
  cam+=(camT-cam)*Math.min(1,dt*6);for(const f of falls){f.vy+=1600*dt;f.y-=f.vy*dt/BH}falls=falls.filter(f=>by(f.y)<H+BH);
  draw();requestAnimationFrame(frame)}
function by(i){return H-110-(i+1)*BH+cam}
const stackColors=['indigo','blue','teal','green','orange','pink','purple'];
function blk(x,y,w,h,i){ctx.fillStyle=boardColors[stackColors[i%stackColors.length]];ctx.beginPath();ctx.roundRect(x,y,w,BH-2,6);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);
  tower.forEach((b,i)=>{const y=by(i);if(y>-BH&&y<H)blk(b.x,y,b.w,BH,i)});
  if(state!=='dead')blk(mv.x,by(tower.length),mv.w,BH,tower.length);
  for(const f of falls)blk(f.x,by(f.y),f.w,BH,f.h-1);
  ctx.fillStyle=boardColors.cell;ctx.fillRect(0,by(-1),W,H)}
$('board').addEventListener('pointerdown',e=>{e.preventDefault();drop()});
addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();drop()}});
$('newbtn').onclick=reset;reset();requestAnimationFrame(frame);
</script></body></html>
