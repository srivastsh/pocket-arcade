<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hop</title><link rel="stylesheet" href="shared.css"><style>
.board{position:relative;width:min(92vw,380px,calc((100vh - 220px)*.6));aspect-ratio:3/5;border-radius:var(--r);background:linear-gradient(var(--sky-top),var(--sky-bottom));box-shadow:var(--shadow);overflow:hidden;line-height:0;touch-action:none;cursor:none}
canvas{width:100%;height:100%;display:block}</style></head><body><header class="bar"><a class="back" href="index.html">Games</a><h1>Hop</h1><div class="right"><button class="btn sec" id="newbtn">New Game</button></div></header><main>
<div class="stats"><div class="stat"><small>Height</small><b id="score">0</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div>
<div class="board" id="board"><canvas id="cv"></canvas><div class="overlay" id="ov"><div class="game-sheet" role="group" aria-labelledby="sheet-title"><h2 id="sheet-title">Hop</h2><p>Steer with A/D, ←/→, the mouse or touch. Press Space to start.</p><button class="btn">Play</button></div></div></div></main><script src="board-colors.js"></script><script src="controls.js"></script><script src="common.js"></script><script>
const cv=$('cv'),ctx=cv.getContext('2d'),ov=$('ov'),W=360,H=600,dpr=Math.min(devicePixelRatio||1,3);cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
let p,pl,score,state='idle',last=0,tx=null,best=+ls('bestHop')||0,topY;
function plat(y,t){return{x:rnd(W-70),y,w:66,t:t||0,v:(60+rnd(50))*(Math.random()<.5?1:-1),gone:0}}
function reset(){p={x:W/2,y:H-120,vx:0,vy:-720};pl=[{x:W/2-33,y:H-80,w:66,t:0,v:0}];topY=H-80;score=0;state='run';fill();$('score').textContent=0;$('best').textContent=best;ov.classList.add('hide')}
function fill(){while(topY>-80){const g=60+rnd(30+Math.min(score/40,34));topY-=g;const r=Math.random();pl.push(plat(topY,score>300&&r<.18?2:score>150&&r<.38?1:0))}}
function die(){state='over';if(score>best){best=score;ls('bestHop',best)}$('best').textContent=best;overlay(ov,'Game Over','Height '+score,'Try Again',reset)}
function upd(dt){const prev=p.y;
  const ax=(held('ArrowLeft')?-1:0)+(held('ArrowRight')?1:0);if(tx!=null){p.vx+=Math.max(-1,Math.min(1,(tx-p.x)/40))*2400*dt}else p.vx+=ax*2400*dt;p.vx*=Math.pow(.02,dt);p.vx=Math.max(-340,Math.min(340,p.vx));
  p.x+=p.vx*dt;if(p.x<-12)p.x=W+12;if(p.x>W+12)p.x=-12;p.vy+=1700*dt;p.y+=p.vy*dt;
  for(const q of pl){if(q.t===1){q.x+=q.v*dt;if(q.x<0)q.v=Math.abs(q.v);else if(q.x+q.w>W)q.v=-Math.abs(q.v)}
    if(!q.gone&&p.vy>0&&prev+10<=q.y+4&&p.y+10>=q.y&&p.x+12>q.x&&p.x-12<q.x+q.w){p.vy=-720;if(q.t===2)q.gone=1}}
  if(p.y<H*.42){const dy=H*.42-p.y;p.y+=dy;for(const q of pl)q.y+=dy;topY+=dy;score+=Math.round(dy);$('score').textContent=score;fill()}
  pl=pl.filter(q=>q.y<H+20&&!(q.gone&&q.y>H));if(p.y>H+40)die()}
function draw(){ctx.clearRect(0,0,W,H);
  for(const q of pl){if(q.gone)continue;ctx.fillStyle=q.t===0?boardColors.green:q.t===1?boardColors.blue:boardColors.wood;ctx.beginPath();ctx.roundRect(q.x,q.y,q.w,13,6.5);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.roundRect(q.x+3,q.y+2,q.w-6,4,2);ctx.fill()}
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.vx/1800);const sq=1+Math.max(-.12,Math.min(.12,p.vy/6000));ctx.scale(1/sq,sq);
  ctx.fillStyle=boardColors.yellow;ctx.beginPath();ctx.roundRect(-14,-24,28,32,12);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,-14,5,0,7);ctx.arc(6,-14,5,0,7);ctx.fill();ctx.fillStyle='#1c1c1e';ctx.beginPath();ctx.arc(-4,-14,2.2,0,7);ctx.arc(7,-14,2.2,0,7);ctx.fill();ctx.fillStyle=boardColors.orange;ctx.fillRect(-14,6,28,4);ctx.restore()}
function frame(t){const dt=Math.min((t-(last||t))/1000,.033);last=t;if(state==='run')upd(dt);draw();requestAnimationFrame(frame)}
const aim=e=>{const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W};$('board').addEventListener('pointermove',aim);$('board').addEventListener('pointerdown',aim);
const held = bindGameKeys({
  ArrowLeft: () => { tx = null; }, ArrowRight: () => { tx = null; },
  ' ': event => { if (!event.repeat && state !== 'run') { tx = null; reset(); } }
});
ov.querySelector('button').onclick=reset;$('newbtn').onclick=reset;p={x:W/2,y:H-120,vx:0,vy:0};pl=[];requestAnimationFrame(frame);</script></body></html>
