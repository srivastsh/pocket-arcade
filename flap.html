<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flap</title><link rel="stylesheet" href="shared.css">
<style>
.board{position:relative;width:min(92vw,380px,calc((100vh - 220px)*.6));aspect-ratio:3/5;border-radius:var(--r);background:linear-gradient(var(--sky-top),var(--sky-bottom));box-shadow:var(--shadow);overflow:hidden;line-height:0;touch-action:none;cursor:pointer}
canvas{width:100%;height:100%;display:block}


</style></head><body>
<header class="bar"><a class="back" href="index.html">Games</a><h1>Flap</h1><div class="right"><button class="btn sec" id="newbtn">New Game</button></div></header>
<main>
<div class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div>
<div class="board" id="board"><canvas id="cv"></canvas><div class="overlay" id="ov"><div class="game-sheet" role="group" aria-labelledby="ovt"><h2 id="ovt">Flap</h2><p id="ovp">Tap, click or press W, ↑ or Space to flap.</p></div></div></div>
</main>
<script src="board-colors.js"></script><script src="controls.js"></script><script>
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Array.isArray(r)?r[0]:r;r=Math.max(0,Math.min(+r||0,Math.abs(w)/2,Math.abs(h)/2));this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),ov=$('ov');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const W=360,H=600,GR=64,dpr=Math.min(devicePixelRatio||1,3);cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const BX=100,BRAD=13,GAP=170,PW=66;
let y,vy,pipes,score,best=+ls('bestFlap')||0,state='idle',last=0,off=0,spawnX;
function reset(){y=H/2-GR/2;vy=0;pipes=[];score=0;state='idle';spawnX=W+40;$('score').textContent=0;$('best').textContent=best;$('ovt').textContent='Flap';$('ovp').textContent='Tap, click or press W, ↑ or Space to flap.';ov.classList.remove('hide')}
function flap(){if(state==='dead'){if(performance.now()-dieT<=500)return;reset()}if(state==='idle'){state='run';ov.classList.add('hide');pipes=[];addPipe(W+60)}vy=-430}
let dieT=0;
function addPipe(x){pipes.push({x,gy:90+Math.random()*(H-GR-GAP-180),p:false})}
function die(){state='dead';dieT=performance.now();$('ovt').textContent='Game Over';$('ovp').textContent='Score '+score+'. Tap or press W to retry.';ov.classList.remove('hide')}
function frame(t){const dt=Math.min((t-(last||t))/1000,.033);last=t;
  if(state==='run'){vy+=1500*dt;y+=vy*dt;off=(off+165*dt)%32;
    for(const p of pipes)p.x-=165*dt;
    if(pipes[pipes.length-1].x<W-230)addPipe(W+20);if(pipes[0].x<-PW-10)pipes.shift();
    for(const p of pipes){if(!p.p&&p.x+PW<BX){p.p=true;score++;$('score').textContent=score;if(score>best){best=score;ls('bestFlap',best);$('best').textContent=best}}
      if(BX+BRAD>p.x&&BX-BRAD<p.x+PW&&(y-BRAD<p.gy||y+BRAD>p.gy+GAP))die()}
    if(y+BRAD>H-GR){y=H-GR-BRAD;die()}if(y<BRAD){y=BRAD;vy=0}}
  else if(state==='idle'){y=H/2-GR/2+Math.sin(t/260)*8;off=(off+60*dt)%32}
  else if(state==='dead'){vy+=1500*dt;y=Math.min(y+vy*dt,H-GR-BRAD)}
  draw();requestAnimationFrame(frame)}
function draw(){ctx.clearRect(0,0,W,H);
  ctx.fillStyle=boardColors.cloud;for(const[cx,cy,s]of[[60,110,1],[250,60,1.3],[320,200,.8]]){ctx.beginPath();ctx.ellipse(cx,cy,34*s,14*s,0,0,7);ctx.ellipse(cx+20*s,cy-8*s,22*s,14*s,0,0,7);ctx.fill()}
  ctx.fillStyle=boardColors.green;for(const p of pipes){ctx.save();ctx.translate(p.x,0);
    ctx.fillRect(4,-20,PW-8,p.gy-6);ctx.beginPath();ctx.roundRect(0,p.gy-26,PW,26,8);ctx.fill();
    ctx.fillRect(4,p.gy+GAP+26,PW-8,H);ctx.beginPath();ctx.roundRect(0,p.gy+GAP,PW,26,8);ctx.fill();ctx.restore()}
  ctx.fillStyle=boardColors.sand;ctx.fillRect(0,H-GR,W,GR);ctx.fillStyle=boardColors.green;ctx.fillRect(0,H-GR,W,12);
  ctx.fillStyle='rgba(0,0,0,.08)';for(let x=-off;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,H-GR+12);ctx.lineTo(x+16,H-GR+12);ctx.lineTo(x+4,H-GR+24);ctx.lineTo(x-12,H-GR+24);ctx.fill()}
  ctx.save();ctx.translate(BX,y);ctx.rotate(Math.max(-.4,Math.min(1.2,vy/700)));
  ctx.fillStyle=boardColors.yellow;ctx.beginPath();ctx.arc(0,0,BRAD+1,0,7);ctx.fill();
  ctx.fillStyle=boardColors.orange;ctx.beginPath();ctx.ellipse(BRAD+2,3,7,4,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-4,5,0,7);ctx.fill();ctx.fillStyle='#1c1c1e';ctx.beginPath();ctx.arc(6.5,-4,2.4,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-5,3,6,4,-.4+(state==='run'?Math.sin(performance.now()/60)*.5:0),0,7);ctx.fill();ctx.restore()}
$('board').addEventListener('pointerdown',e=>{e.preventDefault();flap()});
function flapKey(event) { if (!event.repeat) flap(); }
bindGameKeys({ ArrowUp: flapKey, ' ': flapKey });
$('newbtn').onclick=reset;reset();requestAnimationFrame(frame);
</script></body></html>
