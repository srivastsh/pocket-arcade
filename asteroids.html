<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asteroids</title><link rel="stylesheet" href="shared.css">
<style>
.board{position:relative;width:min(92vw,600px,calc(100vh - 230px));aspect-ratio:1;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden;line-height:0}
canvas{width:100%;height:100%;display:block}
</style></head><body>
<header class="bar"><a class="back" href="index.html">Games</a><h1>Asteroids</h1><div class="right"><button class="btn sec" id="newbtn">New Game</button></div></header>
<main>
<div class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Lives</small><b id="lives">3</b></div><div class="stat"><small>Level</small><b id="lvl">1</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div>
<div class="board"><canvas id="cv"></canvas><div class="overlay" id="ov"><div class="game-sheet" role="group" aria-labelledby="ovt"><h2 id="ovt">Asteroids</h2><p id="ovp">A/D or ←/→ rotate. W or ↑ thrusts. Hold Space to fire.</p><button class="btn" id="ovb">Play</button></div></div></div>
</main>
<script src="board-colors.js"></script><script src="controls.js"></script><script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),ov=$('ov');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const W=600,dpr=Math.min(devicePixelRatio||1,3);cv.width=cv.height=W*dpr;ctx.scale(dpr,dpr);
const R={3:44,2:24,1:12},PT={3:20,2:50,1:100};

let sh,rocks=[],bl=[],pf=[],score=0,lives=3,lvl=1,state='idle',last=0,best=+ls('bestAst')||0,cd=0,pend=0;
function rock(x,y,s,sp){const a=Math.random()*7,v=sp||(40+Math.random()*50+lvl*8);const n=11,pts=[];for(let i=0;i<n;i++)pts.push(.78+Math.random()*.4);return{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s,r:R[s],rot:Math.random()*7,vr:(Math.random()-.5)*1.2,pts}}
function wave(){rocks=[];for(let i=0;i<3+lvl;i++){let x,y;do{x=Math.random()*W;y=Math.random()*W}while(Math.hypot(x-W/2,y-W/2)<160);rocks.push(rock(x,y,3))}}
function spawn(){sh={x:W/2,y:W/2,a:-Math.PI/2,vx:0,vy:0,inv:2.5,dead:0}}
function hud(){$('score').textContent=score;$('lives').textContent=lives;$('lvl').textContent=lvl;if(score>best){best=score;ls('bestAst',best)}$('best').textContent=best}
function full(){pend=0;score=0;lives=3;lvl=1;bl=[];pf=[];wave();spawn();hud();state='run';ov.classList.add('hide')}
function over(){state='over';$('ovt').textContent='Game Over';$('ovp').textContent='Score '+score;$('ovb').textContent='Try Again';ov.classList.remove('hide')}
const wrap=o=>{o.x=(o.x+W)%W;o.y=(o.y+W)%W};
function boom(x,y,n=14){for(let i=0;i<n;i++){const a=Math.random()*7,v=40+Math.random()*140;pf.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6+Math.random()*.4})}}
function upd(dt){cd-=dt;
  if(sh.dead>0){sh.dead-=dt;if(sh.dead<=0){if(lives<=0)return over();spawn()}}
  else{sh.inv-=dt;if(held('ArrowLeft'))sh.a-=4.2*dt;if(held('ArrowRight'))sh.a+=4.2*dt;
    if(held('ArrowUp')){sh.vx+=Math.cos(sh.a)*300*dt;sh.vy+=Math.sin(sh.a)*300*dt}
    const f=Math.pow(.55,dt);sh.vx*=f;sh.vy*=f;const sp=Math.hypot(sh.vx,sh.vy);if(sp>420){sh.vx*=420/sp;sh.vy*=420/sp}
    sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;wrap(sh);
    if(held(' ')&&cd<=0&&bl.length<5){bl.push({x:sh.x+Math.cos(sh.a)*16,y:sh.y+Math.sin(sh.a)*16,vx:Math.cos(sh.a)*520+sh.vx*.3,vy:Math.sin(sh.a)*520+sh.vy*.3,l:.95});cd=.18}}
  for(const r of rocks){r.x+=r.vx*dt;r.y+=r.vy*dt;r.rot+=r.vr*dt;wrap(r)}
  for(const b of bl){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;wrap(b)}bl=bl.filter(b=>b.l>0);
  for(const p of pf){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}pf=pf.filter(p=>p.l>0);
  const nr=[];
  for(const r of rocks){let hit=false;for(const b of bl)if(b.l>0&&Math.hypot(b.x-r.x,b.y-r.y)<r.r){b.l=0;hit=true;break}
    if(hit){score+=PT[r.s];boom(r.x,r.y,r.s*4);if(r.s>1){nr.push(rock(r.x,r.y,r.s-1,Math.hypot(r.vx,r.vy)*1.25),rock(r.x,r.y,r.s-1,Math.hypot(r.vx,r.vy)*1.25))}hud()}else nr.push(r)}
  rocks=nr;
  if(sh.dead<=0&&sh.inv<=0)for(const r of rocks)if(Math.hypot(sh.x-r.x,sh.y-r.y)<r.r*.9+9){boom(sh.x,sh.y,26);lives--;sh.dead=1.2;hud();break}
  if(!rocks.length){pend+=dt;if(pend>=.9){pend=0;lvl++;wave();hud()}}}
function draw(){ctx.clearRect(0,0,W,W);const tx=boardColors.text;ctx.strokeStyle=tx;ctx.fillStyle=tx;ctx.lineWidth=2;ctx.lineJoin='round';
  for(const r of rocks){ctx.beginPath();r.pts.forEach((p,i)=>{const a=r.rot+i/r.pts.length*Math.PI*2,x=r.x+Math.cos(a)*r.r*p,y=r.y+Math.sin(a)*r.r*p;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.stroke()}
  if(sh.dead<=0&&(sh.inv<=0||Math.floor(sh.inv*10)%2)){ctx.save();ctx.translate(sh.x,sh.y);ctx.rotate(sh.a);ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-11,-10);ctx.lineTo(-6,0);ctx.lineTo(-11,10);ctx.closePath();ctx.stroke();
    if(held('ArrowUp')){ctx.strokeStyle=boardColors.orange;ctx.beginPath();ctx.moveTo(-8,-5);ctx.lineTo(-18-Math.random()*6,0);ctx.lineTo(-8,5);ctx.stroke()}ctx.restore()}
  ctx.fillStyle=boardColors.blue;for(const b of bl){ctx.beginPath();ctx.arc(b.x,b.y,2.6,0,7);ctx.fill()}
  ctx.fillStyle=tx;for(const p of pf){ctx.globalAlpha=Math.max(0,p.l*1.5);ctx.fillRect(p.x,p.y,2,2)}ctx.globalAlpha=1}
function frame(ts){const dt=Math.min((ts-(last||ts))/1000,.033);last=ts;if(state==='run')upd(dt);draw();requestAnimationFrame(frame)}
const held = bindGameKeys({
  ArrowLeft: null, ArrowRight: null, ArrowUp: null,
  ' ': event => { if (!event.repeat && state !== 'run') full(); }
});
$('ovb').onclick=full;$('newbtn').onclick=full;sh={x:W/2,y:W/2,a:-Math.PI/2,vx:0,vy:0,inv:0,dead:0};wave();hud();requestAnimationFrame(frame);
</script></body></html>
