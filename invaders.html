<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invaders</title><link rel="stylesheet" href="shared.css">
<style>
.board{position:relative;width:min(92vw,480px,calc((100vh - 230px)*.75));aspect-ratio:3/4;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden;line-height:0;touch-action:none;cursor:none}
canvas{width:100%;height:100%;display:block}.overlay{cursor:default}
</style></head><body>
<header class="bar"><a class="back" href="index.html">Games</a><h1>Invaders</h1><div class="right"><button class="btn sec" id="newbtn">New Game</button></div></header>
<main>
<div class="stats"><div class="stat"><small>Score</small><b id="score">0</b></div><div class="stat"><small>Lives</small><b id="lives">3</b></div><div class="stat"><small>Wave</small><b id="lvl">1</b></div><div class="stat"><small>Best</small><b id="best">0</b></div></div>
<div class="board" id="board"><canvas id="cv"></canvas><div class="overlay" id="ov"><div class="game-sheet" role="group" aria-labelledby="ovt"><h2 id="ovt">Invaders</h2><p id="ovp">Move with A/D, ←/→, the mouse or touch. Tap or press Space to fire.</p><button class="btn" id="ovb">Play</button></div></div></div>
</main>
<script src="board-colors.js"></script><script src="controls.js"></script><script>
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Array.isArray(r)?r[0]:r;r=Math.max(0,Math.min(+r||0,Math.abs(w)/2,Math.abs(h)/2));this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),ov=$('ov');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};
const W=480,H=640,dpr=Math.min(devicePixelRatio||1,3);cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
const ROW=['red','orange','yellow','green','blue'];

let px=W/2,al=[],dir=1,pb=[],ab=[],sh=[],score=0,lives=3,lvl=1,state='idle',cd=0,fireT=1,inv=0,last=0,mx=null,best=+ls('bestInv')||0,t=0;
function wave(){al=[];for(let r=0;r<5;r++)for(let c=0;c<8;c++)al.push({x:50+c*46,y:90+r*38,r,c,a:1});dir=1;ab=[];pb=[];fireT=1;sh=[];
  for(let b=0;b<4;b++){const bx=44+b*110;for(let i=0;i<9;i++)for(let j=0;j<5;j++){if(j>=3&&i>=3&&i<=5)continue;sh.push({x:bx+i*6,y:H-140+j*6})}}}
function hud(){$('score').textContent=score;$('lives').textContent=lives;$('lvl').textContent=lvl;if(score>best){best=score;ls('bestInv',best)}$('best').textContent=best}
function full(){score=0;lives=3;lvl=1;px=W/2;inv=0;wave();hud();state='run';ov.classList.add('hide')}
function over(){state='over';$('ovt').textContent='Game Over';$('ovp').textContent='Score '+score;$('ovb').textContent='Try Again';ov.classList.remove('hide')}
function fire(){if(state!=='run')return;if(cd<=0&&pb.length<3){pb.push({x:px,y:H-56});cd=.3}}
function upd(dt){t+=dt;cd-=dt;inv-=dt;
  if(held('ArrowLeft')){px-=320*dt;mx=null}if(held('ArrowRight')){px+=320*dt;mx=null}if(mx!=null)px=mx;px=Math.max(22,Math.min(W-22,px));
  const alive=al.filter(a=>a.a);if(!alive.length){lvl++;wave();hud();return}
  const sp=22+lvl*5+(40-alive.length)*2.6;let hit=false;
  for(const a of alive){a.x+=dir*sp*dt;if(a.x<10||a.x>W-38)hit=true}
  if(hit){dir=-dir;for(const a of alive){a.y+=16;a.x+=dir*3}}
  if(alive.some(a=>a.y+22>=H-100)){lives=0;hud();return over()}
  fireT-=dt;if(fireT<=0){fireT=Math.max(.3,1.1-lvl*.08)*(.6+Math.random()*.8);const low={};for(const a of alive)if(!low[a.c]||a.y>low[a.c].y)low[a.c]=a;const k=Object.values(low),s=k[Math.random()*k.length|0];ab.push({x:s.x+14,y:s.y+22})}
  for(const b of pb)b.y-=560*dt;for(const b of ab)b.y+=(230+lvl*18)*dt;
  pb=pb.filter(b=>b.y>-10);ab=ab.filter(b=>b.y<H+10);
  for(const b of pb)for(const a of alive)if(a.a&&b.x>a.x&&b.x<a.x+28&&b.y>a.y&&b.y<a.y+20){a.a=0;b.y=-99;score+=(5-a.r)*10;hud()}
  for(const arr of[pb,ab])for(const b of arr)for(let i=0;i<sh.length;i++){const s=sh[i];if(b.x>=s.x&&b.x<s.x+6&&b.y>=s.y&&b.y<s.y+6){sh.splice(i,1);b.y=arr===pb?-99:H+99;break}}
  for(const a of alive)if(a.y+20>H-150)sh=sh.filter(s=>!(s.x+6>a.x&&s.x<a.x+28&&s.y+6>a.y&&s.y<a.y+20));
  if(inv<=0)for(const b of ab)if(b.x>px-18&&b.x<px+18&&b.y>H-52&&b.y<H-28){b.y=H+99;lives--;inv=1.6;hud();ab=[];if(lives<=0)return over();break}}
function draw(){ctx.clearRect(0,0,W,H);const tx=boardColors.text;
  ctx.fillStyle=boardColors.green;for(const s of sh)ctx.fillRect(s.x,s.y,6,6);
  for(const a of al){if(!a.a)continue;ctx.fillStyle=boardColors[ROW[a.r]];ctx.beginPath();ctx.roundRect(a.x,a.y,28,18,7);ctx.fill();
    const f=Math.floor(t*2+a.c)%2;ctx.fillRect(a.x+4+f*2,a.y+16,5,6);ctx.fillRect(a.x+19-f*2,a.y+16,5,6);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(a.x+9,a.y+8,3.2,0,7);ctx.arc(a.x+19,a.y+8,3.2,0,7);ctx.fill();ctx.fillStyle='#1c1c1e';ctx.beginPath();ctx.arc(a.x+9.5,a.y+8,1.4,0,7);ctx.arc(a.x+19.5,a.y+8,1.4,0,7);ctx.fill()}
  if(inv<=0||Math.floor(inv*10)%2){ctx.fillStyle=tx;ctx.beginPath();ctx.moveTo(px-20,H-32);ctx.lineTo(px-12,H-44);ctx.lineTo(px-3,H-44);ctx.lineTo(px,H-56);ctx.lineTo(px+3,H-44);ctx.lineTo(px+12,H-44);ctx.lineTo(px+20,H-32);ctx.closePath();ctx.fill()}
  ctx.fillStyle=boardColors.blue;for(const b of pb)ctx.fillRect(b.x-1.5,b.y,3,12);ctx.fillStyle=boardColors.red;for(const b of ab)ctx.fillRect(b.x-1.5,b.y,3,12)}
function frame(ts){const dt=Math.min((ts-(last||ts))/1000,.033);last=ts;if(state==='run')upd(dt);draw();requestAnimationFrame(frame)}
const bd=$('board');bd.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*W});
bd.addEventListener('pointerdown',e=>{if(state!=='run')return;const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*W;fire()});
const held = bindGameKeys({
  ArrowLeft: null, ArrowRight: null,
  ' ': event => {
    if (state !== 'run') { if (!event.repeat) full(); }
    else fire();
  }
});
$('ovb').onclick=full;$('newbtn').onclick=full;wave();hud();requestAnimationFrame(frame);
</script></body></html>
